name: بناء التطبيق
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          if [ -n "$KS_PASSWORD" ]; then echo "$KS_B64" | base64 -d > basma-upload.jks; fi
          gradle :app:assembleDebug --no-daemon --stacktrace
          mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/basma.apk
          if [ -n "$KS_PASSWORD" ]; then
            gradle :app:bundleRelease --no-daemon && cp app/build/outputs/bundle/release/app-release.aab out/basma.aab
          fi
      - uses: actions/upload-artifact@v4
        with: { name: basma, path: out/ }
      - name: Publish latest APK
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/basma.apk --title "بصمتي المرنة — أحدث نسخة" \
            --notes "نسخة أندرويد للتجربة. ثبّت basma.apk على هاتفك." --latest
